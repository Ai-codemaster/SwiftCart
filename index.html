<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftCart</title>

    <!-- Tailwind & Daisy UI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Font 'Montserrat' -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS File Link -->
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <!-- Header Section -->

    <header class="shadow-lg">
      <nav class="relative flex justify-between items-center px-[4%] lg:px-[8%] py-2">
        <!-- Logo -->
        <div class="text-2xl font-extrabold text-[var(--primary)]">
          <a href="#">SwiftCart</a>
        </div>
        <!-- Menu -->
        <div id="menu" class="fixed sm:static w-1/2 h-full bg-white/80 z-50">
          <ul class="flex flex-col sm:flex-row gap-1 sm:gap-2 xl:gap-4 sm:justify-center sm:text-sm md:text-base">
            <li>
              <a
                class="py-2 block hover:bg-blue-100 active:bg-blue-100 sm:rounded-sm  pl-[4%] sm:px-3 lg:px-6"
                href="#"
                >Home</a
              >
            </li>
            <li>
              <a
                class="py-2 block hover:bg-blue-100 active:bg-blue-100 sm:rounded-sm pl-[4%] sm:px-3 lg:px-6"
                href="#"
                >Products</a
              >
            </li>
            <li>
              <a
                class="py-2 block hover:bg-blue-100 active:bg-blue-100 sm:rounded-sm pl-[4%] sm:px-3 lg:px-6"
                href="#"
                >About</a
              >
            </li>
            <li>
              <a
                class="py-2 block hover:bg-blue-100 active:bg-blue-100 sm:rounded-sm pl-[4%] sm:px-3 lg:px-6"
                href="#"
                >Contacts</a
              >
            </li>
          </ul>
        </div>
        <!-- Menu Icon & Shoping Card -->
        <div class="flex gap-6 justify-center items-center text-xl">
          <i class="fa-solid fa-cart-shopping md:text-2xl"></i>

          <button id="menuBtn" class="text-2xl px-2 sm:hidden">☰</button>
        </div>
        <!-- Mobile Menu Clolse Box -->
        <div id="backBox" class="fixed inset-0 bg-black/50 z-40 hidden"></div>
      </nav>
    </header>

    <!-- Main Section -->

    <main></main>

    <!-- Footer Section -->

    <footer></footer>

    <!-- JS File Link -->
    <script src="./script/script.js"></script>
  </body>
</html>
