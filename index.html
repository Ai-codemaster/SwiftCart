<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftCart</title>

    <!-- Tailwind & Daisy UI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Font 'Montserrat' -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS File Link -->
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <!-- Header Section -->

    <header class="sticky top-0 bg-white shadow">
      <nav class="flex justify-between items-center relative px-[4%] py-2">
        <!-- Logo -->

        <div class="text-[var(--primary)] text-2xl font-extrabold">
          <a href="#">SwiftCart</a>
        </div>
        <!-- Desktop Menu -->
        <div class="hidden sm:block">
          <ul class="flex gap-6 text-sm font-semibold text-[var(--texta)]">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </div>
        <!-- Right Side Icon -->
        <div
          class="flex gap-8 items-center text-xl font-bold text-[var(--text1)]"
        >
          <!-- Shoping Card -->
          <i class="fa-solid fa-cart-shopping"></i>

          <!-- Mobile Menu Icon -->
          <button class="py-1 px-2 cursor-pointer sm:hidden" id="menuBtn">
            ☰
          </button>
        </div>

        <!-- Mobile Dropdown -->
        <div
          id="mobileMenu"
          class="absolute top-full right-0 w-full text-center bg-blue-50/40 transform translate-x-full transition-transform duration-200 ease-in-out sm:hidden"
        >
          <ul class="text-[var(--text1)]">
            <li>
              <a class="block py-2 hover:bg-blue-100/60" href="#">Home</a>
            </li>
            <li>
              <a class="block py-2 hover:bg-blue-100/60" href="#">Products</a>
            </li>
            <li>
              <a class="block py-2 hover:bg-blue-100/60" href="#">About</a>
            </li>
            <li>
              <a class="block py-2 hover:bg-blue-100/60" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- Main Section -->

    <main
      class="bg-[url(./assets/banner-image.png)] w-full h-90 bg-cover bg-center"
    ></main>

    <!-- Footer Section -->

    <footer></footer>

    <!-- JS File Link -->
    <script src="./script/script.js"></script>
  </body>
</html>
